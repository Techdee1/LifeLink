version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: lifelink
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  spring-boot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000
      INTERSWITCH_PAYMENT_CLIENT_ID: ${INTERSWITCH_PAYMENT_CLIENT_ID}
      INTERSWITCH_PAYMENT_CLIENT_SECRET: ${INTERSWITCH_PAYMENT_CLIENT_SECRET}
      INTERSWITCH_PAYMENT_MERCHANT_CODE: ${INTERSWITCH_PAYMENT_MERCHANT_CODE}
      INTERSWITCH_PAYMENT_PAYID: ${INTERSWITCH_PAYMENT_PAYID}
      INTERSWITCH_VERIFICATION_ID: ${INTERSWITCH_VERIFICATION_ID}
      INTERSWITCH_VERIFICATION_SECRET: ${INTERSWITCH_VERIFICATION_SECRET}
      INTERSWITCH_GENERAL_CLIENT_ID: ${INTERSWITCH_GENERAL_CLIENT_ID}
      INTERSWITCH_GENERAL_CLIENT_SECRET: ${INTERSWITCH_GENERAL_CLIENT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-password}@mysql:3306/lifelink
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY}
      AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION:-eastus}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
