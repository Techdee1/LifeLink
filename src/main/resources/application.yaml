spring:
  application:
    name: lifelink
  datasource:
    url: jdbc:mysql://localhost:3306/lifelink
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Henry123@#$
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
      show_sql: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

debug: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security.web: DEBUG

INTERSWITCH:
  PAYMENT_CLIENT_ID: ${INTERSWITCH_PAYMENT_CLIENT_ID}
  PAYMENT_CLIENT_SECRET: ${INTERSWITCH_PAYMENT_CLIENT_SECRET}
  PAYMENT_MERCHANT_CODE: ${INTERSWITCH_PAYMENT_MERCHANT_CODE}
  PAYMENT_PAYID: ${INTERSWITCH_PAYMENT_PAYID}
  VERIFICATION_CLIENT_ID: ${INTERSWITCH_VERIFICATION_ID}
  VERIFICATION_CLIENT_SECRET: ${INTERSWITCH_VERIFICATION_SECRET}

  WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY}

twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  whatsapp:
    number: ${TWILIO_WHATSAPP}